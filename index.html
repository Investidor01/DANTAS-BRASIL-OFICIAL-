<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>INFO DANTAS BRASIL - Notícias e Bolsa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Notícias do Brasil e do mundo, economia, política e cotações da bolsa de valores em tempo real.">
  <meta name="theme-color" content="#c00">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23c00%22/></svg>">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:900,700,400|Roboto:400,700&display=swap">
  <style>
    :root {
      --vermelho: #c00;
      --vermelho-escuro: #900;
      --cinza-bg: #181818;
      --cinza-card: #222;
      --cinza-menu: #1a1a1a;
      --cinza-borda: #333;
      --branco: #fff;
      --cinza-texto: #eaeaea;
      --cinza-claro: #f5f5f5;
      --fonte-titulo: 'Montserrat', sans-serif;
      --fonte-texto: 'Roboto', Arial, sans-serif;
    }
    html, body {margin: 0; padding: 0; background: var(--cinza-bg); color: var(--cinza-texto);}
    body {font-family: var(--fonte-texto);}
    /* Header fixo estilo CNN Brasil */
    header {
      background: var(--branco);
      border-bottom: 4px solid var(--vermelho);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px #0003;
    }
    .header-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.7em 2vw;
    }
    .logo-title {
      font-family: var(--fonte-titulo);
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--branco);
      background: var(--vermelho);
      border-radius: 8px;
      padding: 0.13em 1.1em;
      letter-spacing: 1.5px;
      text-shadow: 0 1px 8px #0002;
      margin-right: 1em;
      box-shadow: 0 2px 8px #c0040444;
      display: inline-block;
      white-space: nowrap;
    }
    /* Menu hamburguer */
    .menu-hamburger {
      background: none;
      border: none;
      color: var(--vermelho);
      font-size: 2.1rem;
      cursor: pointer;
      display: none;
      align-items: center;
      margin-left: 0.5em;
      transition: color .2s;
    }
    .menu-hamburger:hover { color: var(--vermelho-escuro);}
    nav.menu-nav {
      background: none;
      display: flex;
      align-items: center;
    }
    .menu-list {
      list-style: none;
      display: flex;
      gap: 2em;
      margin: 0;
      padding: 0;
    }
    .menu-list li a {
      color: var(--cinza-menu);
      font-family: var(--fonte-titulo);
      font-weight: 700;
      text-decoration: none;
      font-size: 1.15em;
      padding: 0.2em 0.5em;
      border-radius: 3px;
      transition: background .12s, color .12s;
    }
    .menu-list li a:hover, .menu-list li a:focus {
      background: var(--vermelho);
      color: var(--branco);
    }
    /* Menu mobile */
    @media (max-width: 800px) {
      .header-main { flex-wrap: wrap; gap: 0.8em;}
      .menu-hamburger { display: flex;}
      nav.menu-nav {display: none;}
      nav.menu-nav.open {display: block; position: absolute; right: 2vw; top: 4em; background: var(--cinza-menu); border-radius: 10px; box-shadow: 0 4px 20px #0009; z-index: 1000;}
      .menu-list {flex-direction: column; gap: 0;}
      .menu-list li a {padding: 1em 2.5em; font-size: 1.07em; border-radius: 0;}
    }
    /* Linha de ativos */
    .linha-alta-baixa {
      width: 100%;
      max-width: 1200px;
      margin: 0.5em auto 1em auto;
      background: var(--cinza-menu);
      border-radius: 10px;
      box-shadow: 0 2px 10px #c0040444;
      padding: .7em 1.5em;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--branco);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 1.5em;
    }
    .linha-alta-baixa .ativo-bloco {
      background: var(--cinza-card);
      border-radius: 7px;
      box-shadow: 0 1px 8px #c0040422;
      padding: 0.5em 1em;
      margin: 0.2em 0.3em;
      min-width: 165px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .linha-alta-baixa .ativo-bloco strong {
      font-size: 1.02em;
      color: var(--vermelho);
      margin-bottom: 3px;
      letter-spacing: 0.5px;
      font-family: var(--fonte-titulo);
    }
    .linha-alta-baixa .alta {
      color: #05dd05;
    }
    .linha-alta-baixa .baixa {
      color: #f44336;
    }
    .linha-alta-baixa .variacao.positivo {
      background: #1a3b1a;
      color: #0f0;
      padding: 0 4px;
      border-radius: 4px;
    }
    .linha-alta-baixa .variacao.negativo {
      background: #3b1a1a;
      color: #f44336;
      padding: 0 4px;
      border-radius: 4px;
    }
    /* Grid de notícias */
    .news-section {
      max-width: 1200px;
      margin: 2em auto;
      padding: 0 2vw;
    }
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2em 2em;
      margin: 2em 0;
    }
    .news-card {
      background: var(--branco);
      border-radius: 12px;
      box-shadow: 0 2px 18px #0003;
      display: flex;
      flex-direction: column;
      transition: transform .18s, box-shadow .18s;
      border: 1.5px solid var(--cinza-borda);
      overflow: hidden;
      min-height: 420px;
      position: relative;
    }
    .news-card:hover { 
      transform: translateY(-4px) scale(1.01); 
      box-shadow: 0 8px 30px #c0040422, 0 2px 14px #000b;
      border-color: var(--vermelho);
    }
    .news-card .news-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #ccc;
      display: block;
    }
    .news-card .news-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1.1em 1em 1em 1em;
    }
    .news-title {
      font-family: var(--fonte-titulo);
      font-weight: 800;
      color: var(--vermelho);
      font-size: 1.18em;
      margin-bottom: 0.2em;
      letter-spacing: 0.5px;
      min-height: 2.5em;
      line-height: 1.14;
      text-shadow: 0 1px 5px #fff2;
    }
    .news-meta {
      font-size: .93em;
      color: var(--vermelho-escuro);
      margin-bottom: 0.6em;
      font-family: var(--fonte-texto);
      font-weight: 700;
    }
    .news-summary {
      font-size: 1em;
      color: #333;
      font-family: var(--fonte-texto);
      font-weight: 400;
      margin-bottom: 0.8em;
      line-height: 1.55;
      flex: 1 1 auto;
      text-shadow: 0 1px 2px #fff2;
    }
    .news-source {
      font-size: 0.99em;
      color: #666;
      background: #f5f5f5;
      border-radius: 6px;
      padding: 2px 10px;
      font-family: var(--fonte-titulo);
      font-weight: 700;
      align-self: flex-end;
      margin-top: 0.4em;
    }
    .news-card .news-link {
      display: inline-block;
      background: var(--vermelho);
      color: var(--branco);
      text-decoration: none;
      font-weight: 700;
      font-family: var(--fonte-titulo);
      padding: 0.55em 1.15em;
      border-radius: 7px;
      font-size: 1em;
      margin-top: 1.1em;
      box-shadow: 0 1px 6px #c0040444;
      transition: background .18s;
      align-self: flex-start;
    }
    .news-card .news-link:hover { background: var(--vermelho-escuro);}
    /* Títulos e textos */
    section {max-width: 1200px; margin: 0 auto;}
    h2 {
      color: var(--vermelho);
      font-family: var(--fonte-titulo);
      font-weight: 900;
      font-size: 1.6em;
      letter-spacing: 1px;
      margin-top: 2.3em;
      margin-bottom: 0.7em;
      text-align: left;
    }
    @media (max-width: 950px) {
      .news-grid {grid-template-columns:1fr;}
      .header-main {flex-direction: column; align-items:stretch;}
      .logo-title {margin:0 auto;}
    }
    @media (max-width: 700px) {
      h2 {font-size:1.13em;}
      .news-section, section {padding:0 1vw;}
      .linha-alta-baixa {font-size:.97rem;flex-direction:column;gap:0.7em;}
      .linha-alta-baixa .ativo-bloco {width:100%;min-width:unset;}
      .news-card .news-image {height:140px;}
    }
    /* Rodapé */
    footer {
      background: var(--cinza-menu);
      margin-top: 3em;
      padding: 1.5em 0 1em 0;
      border-top: 3px solid var(--vermelho);
      color: #ccc;
      font-size: 1.01em;
      text-align: center;
    }
    footer .footer-social a {color:#c00;margin:0 0.5em;text-decoration:none;}
    footer .footer-social a:hover {text-decoration: underline;}
    /* Outros */
    .loading {color: #c00; font-weight: 700; font-family: var(--fonte-titulo);}
  </style>
</head>
<body>
  <header>
    <div class="header-main">
      <span class="logo-title">INFO DANTAS BRASIL</span>
      <button class="menu-hamburger" id="menu-hamburger" title="Abrir menu" aria-label="Abrir menu">&#9776;</button>
      <nav class="menu-nav" id="menu-nav">
        <ul class="menu-list">
          <li><a href="#">Início</a></li>
          <li><a href="#principais">Principais</a></li>
          <li><a href="#politica">Política</a></li>
          <li><a href="#economia">Economia</a></li>
          <li><a href="#mundo">Mundo</a></li>
          <li><a href="#sobre">Sobre</a></li>
          <li><a href="#contato">Contato</a></li>
        </ul>
      </nav>
    </div>
    <div class="linha-alta-baixa" id="linha-alta-baixa"></div>
  </header>

  <main>
    <section class="news-section">
      <h2>Últimas Notícias de Economia e Negócios</h2>
      <div class="news-grid" id="news-grid">
        <div class="loading">Carregando notícias reais...</div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 <span class="highlight">INFO DANTAS BRASIL</span> • Feito com <span style="color:#c00;">❤</span> para você</p>
      <div class="footer-social" style="margin-top:1em;">
        <a href="https://twitter.com/" target="_blank" title="Twitter" rel="noopener">Twitter</a>
        <a href="https://facebook.com/" target="_blank" title="Facebook" rel="noopener">Facebook</a>
        <a href="https://wa.me/" target="_blank" title="WhatsApp" rel="noopener">WhatsApp</a>
      </div>
    </div>
  </footer>
  <script src="script.js"></script>
  <script>
    // Menu hamburger responsivo
    const menuHamb = document.getElementById('menu-hamburger');
    const menuNav = document.getElementById('menu-nav');
    menuHamb.addEventListener('click', function() {
      menuNav.classList.toggle('open');
    });
    document.addEventListener('click', function(e) {
      if (!menuNav.contains(e.target) && !menuHamb.contains(e.target)) menuNav.classList.remove('open');
    });
    menuHamb.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') menuNav.classList.remove('open');
    });
  </script>
</body>
  </html>
