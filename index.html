<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <link rel="stylesheet" href="styles.css">

      <a href="#terra" class="terra">Terra</a>

      <h2><span class="dot cnnbr"></span>CNN Brasil</h2>
      <div class="news-list" id="news-cnnbr"></div>
