<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Info Dantas Brasil - Últimas Notícias</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Marquee urgente horizontal */
    .marquee-horizontal {
      width: 100vw;
      overflow: hidden;
      height: 34px;
      background: #e30613;
      color: #fff;
      display: flex;
      align-items: center;
      font-size: 1em;
      font-weight: 600;
      letter-spacing: 0.02em;
      border-bottom: 2.5px solid #c00;
      z-index: 10;
    }
    #marquee-urgente {
      margin: 0;
      padding: 0;
      list-style: none;
      width: 100%;
      font-size: 1em;
    }
    /* Notícias imagens menores */
    .noticia-img {
      height: 70px !important;
      max-width: 110px !important;
      object-fit: cover !important;
      border-radius: 8px !important;
      margin-right: 10px;
      vertical-align: middle;
      box-shadow: 0 1px 8px #0002;
    }
    /* Cards e layout notícias */
    .noticia {
      display: flex;
      align-items: flex-start;
      gap: 0.8em;
      background: #161619;
      margin: 0.6em 0;
      padding: 0.5em 1em;
      border-radius: 8px;
      color: #fff;
      box-shadow: 0 2px 12px #0002;
    }
    .noticia-content {
      flex: 1;
      min-width: 0;
    }
    .noticia-chapeu {
      font-size: 0.9em;
      font-weight: bold;
      color: #e30613;
      margin-right: 10px;
    }
    .noticia-data {
      font-size: 0.8em;
      color: #aaa;
    }
    .noticia h3 {
      font-size: 1.05em;
      margin: 0.15em 0 0.25em 0;
      color: #fff;
    }
    .noticia p {
      font-size: 0.96em;
      color: #ccc;
      margin-top: 0.15em;
      margin-bottom: 0.2em;
    }
    .badge-urgente {
      background: #e30613;
      color: #fff;
      font-size: 0.83em;
      padding: 1.5px 7px;
      border-radius: 8px;
      margin-right: 7px;
      letter-spacing: 0.03em;
      font-weight: bold;
    }
    /* Vídeo grid */
    #videos-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.1em;
      margin-bottom: 1em;
      margin-top: 0.5em;
    }
    .video-relacionado.destaque {
      border: 2px solid #e30613;
      border-radius: 10px;
      overflow: hidden;
      background: #161619;
      box-shadow: 0 2px 10px #0003;
      min-width: 300px;
      max-width: 360px;
      flex: 1 1 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .video-relacionado iframe {
      width: 100%;
      min-height: 190px;
      background: #000;
      border: none;
      border-radius: 0 0 7px 7px;
      margin-bottom: 0.1em;
      display: block;
    }
    .video-relacionado span {
      font-size: 0.97em;
      color: #fff;
      padding: 0.3em 0.7em;
      font-weight: 600;
    }
    /* Geral */
    body {
      background: #161619;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    header {
      background: #111117;
      color: #fff;
      padding: 0.7em 0.7em 0.5em 0.7em;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid #e30613;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo {
      font-size: 1.3em;
      font-weight: bold;
      letter-spacing: 0.05em;
      color: #e30613;
      margin-right: 10px;
    }
    nav {
      display: flex;
      gap: 1.3em;
      align-items: center;
    }
    main {
      padding: 1.7em 1em 1.2em 1em;
      max-width: 900px;
      margin: 0 auto;
    }
    h2 {
      color: #e30613;
      margin-top: 1.6em;
      margin-bottom: 0.7em;
      font-size: 1.39em;
      letter-spacing: 0.01em;
    }
    /* Responsivo */
    @media (max-width: 700px) {
      main { padding: 1.2em 2vw; }
      .noticia { flex-direction: column; gap: 0.2em; }
      .video-relacionado.destaque { min-width: 95vw; max-width: 98vw; }
      .video-relacionado iframe { min-height: 205px; }
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">IDB</span>
    <span style="font-size:1.07em; font-weight:500;">INFO DANTAS BRASIL</span>
    <nav>
      <span id="updateTime"></span>
      <span>Online: <span id="onlineCount"></span></span>
    </nav>
  </header>

  <!-- Barra Urgente Horizontal -->
  <div class="marquee-horizontal">
    <ul id="marquee-urgente">
      <li>Carregando notícias urgentes...</li>
    </ul>
  </div>

  <main>
    <h2>Últimas Notícias AoVivo</h2>
    <div id="videos-grid">
      <div style="color:#fff">Carregando vídeos...</div>
    </div>

    <h2>AO VIVO Agora</h2>
    <div id="aovivo-list">
      <div style="color:#fff">Nenhuma transmissão ao vivo no momento.</div>
    </div>

    <h2>Política</h2>
    <ul id="noticias-politica"></ul>

    <h2>Internacional</h2>
    <ul id="noticias-internacional"></ul>

    <h2>Economia</h2>
    <ul id="noticias-economia"></ul>

    <h2>Esportes</h2>
    <ul id="noticias-esportes"></ul>

    <h2>Tecnologia</h2>
    <ul id="noticias-tecnologia"></ul>

    <!-- Adicione outras categorias conforme necessário -->
  </main>

  <!-- Loader -->
  <div id="loader" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#161619ee;z-index:999;display:flex;align-items:center;justify-content:center;">
    <div style="font-size:1.3em;color:#fff;">Carregando...</div>
  </div>

  <button id="topBtn" style="display:none;position:fixed;bottom:15px;right:15px;z-index:200;background:#e30613;color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:1.5em;box-shadow:0 2px 12px #0007;cursor:pointer;">
    ↑
  </button>

  <div style="position:fixed;top:0;left:0;width:0;height:4px;background:#e30613;z-index:1001;" id="progressBar"></div>

  <script src="script.js"></script>
</body>
</html>
