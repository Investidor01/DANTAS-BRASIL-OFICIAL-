<script>
  async function buscarClima() {
    const resposta = await fetch('https://api.openweathermap.org/data/2.5/weather?q=Brasilia&units=metric&appid=d2dbc9154fae0daaf42b27c046652291&lang=pt_br');
    const dados = await resposta.json();
    document.getElementById("weather").innerText =
      `🌤 ${dados.name}: ${dados.weather[0].description}, ${dados.main.temp}°C`;
  }
  buscarClima();
</script>
<div id="weather" style="background:#e3e3e3; padding: 8px; text-align: center;"></div>
