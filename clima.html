<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clima | Info Dantas Brasil</title>
  <link rel="stylesheet" href="style.css" />
  <script src="scripts.js" defer></script>
</head>
<body>
  <header>
    <h1>INFO DANTAS BRASIL - Clima</h1>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="politica.html">Política</a></li>
        <li><a href="esportes.html">Esportes</a></li>
        <li><a href="economia.html">Economia</a></li>
        <li><a href="clima.html">Clima</a></li>
        <li><a href="videos.html">Vídeos</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="destaques" id="clima-section">
      <h2>Previsão do Tempo</h2>
      <div id="weather-container">Carregando previsão do tempo...</div>
    </section>
  </main>
  <footer>
    <p>© 2025 Info Dantas Brasil. Todos os direitos reservados.</p>
  </footer>
  <script>
    // Previsão do tempo básica com OpenWeatherMap
    const apiKey = "SUA_API_OPENWEATHER";
    const city = "São Paulo";
    fetch(\`https://api.openweathermap.org/data/2.5/weather?q=\${city}&appid=\${apiKey}&lang=pt_br&units=metric\`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("weather-container").innerHTML = \`
          <p><strong>Temperatura:</strong> \${data.main.temp}°C</p>
          <p><strong>Clima:</strong> \${data.weather[0].description}</p>
        \`;
      })
      .catch(() => {
        document.getElementById("weather-container").innerText = "Erro ao carregar dados do clima.";
      });
  </script>
</body>
</html>
